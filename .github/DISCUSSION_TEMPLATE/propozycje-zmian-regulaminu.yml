title: "[Dyskusja] "
body:
  - type: markdown
    attributes:
      value: |
        ## Nowa dyskusja komisji regulaminowej

        Wymagane są tylko pola **Koordynator dyskusji** i **Problem**. Pozostałe informacje można uzupełnić teraz albo dopisać później w toku rozmowy.

  - type: input
    id: coordinator
    attributes:
      label: Koordynator dyskusji
      description: Podaj login GitHub osoby porządkującej rozmowę — dzięki temu lista pokaże jej avatar.
      placeholder: "@login"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Opisz krótko sprawę, którą komisja ma omówić, oraz jej skutki.
      placeholder: Na czym polega problem?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Informacje opcjonalne

        Te pola pomagają uporządkować rozmowę, ale nie blokują rozpoczęcia krótkiej dyskusji.

  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options:
        - Nie określono
        - Niski
        - Średni
        - Wysoki

  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - Nie określono
        - Ranking
        - Powołania indywidualne
        - Drużyna
        - Zawody
        - Punktacja
        - Terminy
        - Redakcja regulaminu
        - Inne

  - type: textarea
    id: proposal
    attributes:
      label: Proponowane rozwiązanie
      description: Jeżeli masz już propozycję, opisz ją tutaj.

  - type: textarea
    id: rationale
    attributes:
      label: Uzasadnienie
      description: Wpisz uzgodniony powód decyzji. Wymagane przed rozstrzygnięciem; automat kopiuje tekst dosłownie, nie streszcza komentarzy. Nie wpisuj go ponownie w PR.

  - type: textarea
    id: current_markdown
    attributes:
      label: Fragment Markdown do zastąpienia
      description: Wklej dokładny stary fragment kanonicznego Markdown, razem ze znacznikami jednostek i wcięciami. Nie kopiuj z DOCX ani z podglądu. Automat przeniesie go do pola Stary fragment Markdown w karcie decyzji. Możesz uzupełnić później, ale bez obu fragmentów automat nie zmieni regulaminu.

  - type: textarea
    id: replacement_markdown
    attributes:
      label: Nowe brzmienie Markdown
      description: Wklej kompletny nowy fragment zastępujący stary. Zachowaj identyfikatory istniejących jednostek. Automat przeniesie go do pola Nowy fragment Markdown w karcie decyzji; nie wywnioskuje zmiany z opisu ani uzasadnienia.

  - type: textarea
    id: alternatives
    attributes:
      label: Inne rozważane podejścia
      description: Wymień alternatywy, które warto omówić.

  - type: textarea
    id: materials
    attributes:
      label: Materiały lub przykłady
      description: Dodaj odnośniki, dokumenty albo przykłady istotne dla rozmowy.

  - type: input
    id: related
    attributes:
      label: Zależy od
      description: Podaj identyfikator dyskusji, decyzji lub elementu regulaminu, na przykład #29, DR-015 albo D-29.

  - type: markdown
    attributes:
      value: |
        Przed rozstrzygnięciem uzupełnij Uzasadnienie oraz oba fragmenty Markdown. Dla decyzji bez zmiany dokumentu zostaw oba fragmenty puste i wpisz rozstrzygnięcie w Proponowane rozwiązanie.

        Koordynator dodaje etykietę **rozstrzygnięta** na dyskusji. Automat tworzy kompletną kartę i draft PR. Na PR nadaj **wdrażaj** i poczekaj na DOCX do sprawdzenia; niczego nie przepisuj do karty. Poprawki wprowadzaj w opisie dyskusji. Dla oczywistej korekty bez zmiany sensu etykieta **redakcja-bez-zmiany-sensu** nadal uruchamia szybką ścieżkę.

        [← Powrót do publicznej listy dyskusji](https://fencer4life.github.io/Regulamin_Kadry-SPWS/dyskusje/)
