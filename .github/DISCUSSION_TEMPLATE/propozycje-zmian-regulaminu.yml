name: Propozycja zmiany regulaminu
description: Rozpocznij prostą dyskusję nad problemem dotyczącym regulaminu.
title: "[Dyskusja] "
body:
  - type: markdown
    attributes:
      value: |
        Wystarczą dwa krótkie pola. Pozostałe informacje możesz dodać teraz albo później w komentarzu.

        [Powrót do publicznej listy dyskusji](https://fencer4life.github.io/Regulamin_Kadry-SPWS/dyskusje/)
  - type: input
    id: coordinator
    attributes:
      label: Koordynator dyskusji
      description: Podaj login GitHub lub pseudonim osoby, która będzie porządkowała tę rozmowę.
      placeholder: "@login"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Opisz problem krótko i własnymi słowami.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options: [Nie określono, Niski, Średni, Wysoki]
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options: [Nie określono, Ranking, Powołania indywidualne, Drużyna, Zawody, Punktacja, Terminy, Redakcja regulaminu, Inne]
  - type: textarea
    id: proposal
    attributes:
      label: Proponowane rozwiązanie
      description: Jeśli masz pomysł, opisz go. To pole można pozostawić puste.
  - type: textarea
    id: alternatives
    attributes:
      label: Inne rozważane podejścia
  - type: textarea
    id: materials
    attributes:
      label: Materiały lub przykłady
      description: Linki, dokumenty lub konkretne sytuacje.
  - type: input
    id: related
    attributes:
      label: Powiązane decyzje
      description: Na przykład DR-015. Pozostaw puste, jeśli nie wiesz.
