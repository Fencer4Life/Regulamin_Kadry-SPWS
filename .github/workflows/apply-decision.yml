name: Wdrożenie dokładnej zmiany z decyzji

on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: "Numer przyjętej decyzji z wypełnionymi polami stary/nowy, np. DR-025"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: apply-decision-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r narzedzia/requirements-docx.txt
      - name: Dokładna zamiana, kontrola i jeden PR do przeglądu
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION_ID: ${{ inputs.decision_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DECISION_ID" =~ ^DR-[0-9]{3}$ ]] || { echo "Nieprawidłowy numer decyzji"; exit 1; }
          mapfile -t cards < <(find _decyzje -maxdepth 1 -type f | grep -E "^_decyzje/${DECISION_ID}[-.].*\.md$")
          [[ ${#cards[@]} == 1 ]] || { echo "Nie znaleziono jednej karty decyzji"; exit 1; }
          card="${cards[0]}"
          source="regulamin/Regulamin-powolywania-reprezentacji-Polski-weteranow-w-szermierce_2026.md"
          docx="regulamin/Regulamin-powolywania-reprezentacji-Polski-weteranów-w-szermierce_2026.docx"
          branch="$GITHUB_REF_NAME"
          if [[ "$branch" == main ]]; then
            branch="decision/apply-${DECISION_ID}"
            if git ls-remote --exit-code --heads origin "$branch"; then
              echo "Gałąź wdrożenia już istnieje. Sprawdź PR zamiast ponawiać zmianę."
              gh pr list --head "$branch" --state all
              exit 1
            fi
            git switch -c "$branch"
          else
            # Continue the existing decision PR instead of creating another PR chain.
            gh pr view "$branch" --json state --jq .state | grep -x 'OPEN'
            git switch "$branch"
          fi
          python -m narzedzia.decision_patch "$card" "$source" "$docx"
          python -m narzedzia.prepare_regulamin verify "$source" "$docx"
          python -m unittest discover -s tests -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$card" "$source" "$docx"
          git diff --cached --check
          git commit -m "docs: apply exact change from ${DECISION_ID}"
          git push origin "HEAD:$branch"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "Zaktualizowano istniejący PR: $existing"
          else
            gh pr create --draft --base main --head "$branch" \
              --title "Wdrożenie ${DECISION_ID}: dokładna zmiana Markdown" \
              --body "Automat bez LLM zastosował dosłowną zmianę z karty ${DECISION_ID}. Sprawdź diff źródła i DOCX przed Approve. [DOCX](https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${branch}/${docx}) · [Źródło Markdown](https://github.com/${GITHUB_REPOSITORY}/blob/${branch}/${source}). Testy i kontrola zgodności wykonane w tym uruchomieniu Actions."
          fi
          pr_number=$(gh pr view "$branch" --json number --jq .number)
          python -m narzedzia.pr_docx_link "$GITHUB_REPOSITORY" "$pr_number" "$(git rev-parse HEAD)" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
