name: Utworzenie karty z dyskusji
on:
  discussion:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  discussions: write

concurrency:
  group: decision-numbering
  cancel-in-progress: false

jobs:
  create:
    if: github.event.label.name == 'do rozstrzygnięcia' && github.event.discussion.category.slug == 'propozycje-zmian-regulaminu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Utworzenie karty i draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          branch="decision/discussion-${DISCUSSION_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch"; then exit 0; fi
          if grep -R --fixed-strings "discussion_url: ${DISCUSSION_URL}" _decyzje; then exit 0; fi
          path=$(python narzedzia/create_decision_from_discussion.py "$GITHUB_EVENT_PATH" _decyzje)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$path"
          git commit -m "docs: initiate decision from discussion ${DISCUSSION_NUMBER}"
          git push origin "$branch"
          pr_url=$(gh pr create --draft --label decyzja --title "Decyzja z dyskusji #${DISCUSSION_NUMBER}" --body "Robocza karta utworzona z ${DISCUSSION_URL}. Uzupełnij rozstrzygnięcie, uzasadnienie, relacje i status przed scaleniem.")
          sed -i "s|pr_url: \"\"|pr_url: ${pr_url}|" "$path"
          git add -- "$path"
          git commit -m "docs: link decision draft pull request"
          git push origin "$branch"
          gh api graphql -f query='mutation($discussionId:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussionId,body:$body}){comment{id}}}' -F discussionId="$DISCUSSION_ID" -f body="Utworzono roboczą kartę decyzji: ${pr_url}"
