name: Utworzenie karty z dyskusji
on:
  discussion:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  discussions: write

concurrency:
  group: decision-numbering
  cancel-in-progress: false

jobs:
  create:
    if: github.event.label.name == 'rozstrzygnięta' && github.event.discussion.category.slug == 'propozycje-zmian-regulaminu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Utworzenie karty i draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          branch="decision/discussion-${DISCUSSION_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -R --fixed-strings "discussion_url: ${DISCUSSION_URL}" _decyzje; then exit 0; fi
          if git ls-remote --exit-code --heads origin "$branch"; then
            existing_pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
            if [ -n "$existing_pr" ]; then exit 0; fi
            git fetch origin "$branch"
            git switch --track -c "$branch" "origin/$branch"
            path=$(grep -R -l --fixed-strings "discussion_url: ${DISCUSSION_URL}" _decyzje)
            if [ -z "$path" ]; then
              echo "Nie znaleziono karty na istniejącej roboczej gałęzi." >&2
              exit 1
            fi
          else
            if ! path=$(python narzedzia/create_decision_from_discussion.py "$GITHUB_EVENT_PATH" _decyzje 2>/tmp/decision-error.txt); then
              error=$(cat /tmp/decision-error.txt)
              gh api graphql -f query='mutation($discussionId:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussionId,body:$body}){comment{id}}}' \
                -F discussionId="$DISCUSSION_ID" \
                -f body="Nie utworzono roboczej karty decyzji. ${error}"
              exit 1
            fi
            git switch -c "$branch"
            git add -- "$path"
            git commit -m "docs: initiate decision from discussion ${DISCUSSION_NUMBER}"
            git push origin "$branch"
          fi
          pr_url=$(gh pr create --draft --label decyzja --title "Decyzja z dyskusji #${DISCUSSION_NUMBER}" --body "Robocza karta utworzona z dyskusji ${DISCUSSION_URL}. Uzupełnij uzasadnienie, wybierz Tak albo Nie przy zmianie Regulaminu, sprawdź relacje między decyzjami oraz — jeżeli wybierzesz Tak — dołącz zmianę DOCX przed scaleniem.")
          sed -i "s|pr_url: \"\"|pr_url: ${pr_url}|" "$path"
          git add -- "$path"
          git commit -m "docs: link decision draft pull request"
          git push origin "$branch"
          gh api graphql -f query='mutation($discussionId:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussionId,body:$body}){comment{id}}}' -F discussionId="$DISCUSSION_ID" -f body="Utworzono roboczą kartę decyzji: ${pr_url}"
