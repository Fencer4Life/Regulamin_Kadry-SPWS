name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  discussion:
    types: [created, edited, deleted, transferred, labeled, unlabeled, category_changed]

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: narzedzia/requirements-docx.txt
      - run: python -m pip install -r narzedzia/requirements-docx.txt
      - run: python -m unittest discover -s tests -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pobranie otwartych dyskusji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner:"Fencer4Life", name:"Regulamin_Kadry-SPWS") { discussions(first:100, states:OPEN, orderBy:{field:UPDATED_AT,direction:DESC}) { nodes { number title url createdAt author { login } category { slug } comments { totalCount } labels(first:20) { nodes { name } } } } } }' > /tmp/open-discussions.json
          python narzedzia/sync_discussions.py /tmp/open-discussions.json _data/open_discussions.json
      - uses: actions/configure-pages@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v5
