name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  discussion:
    types: [created, edited, deleted, transferred, labeled, unlabeled, category_changed]

permissions:
  contents: read
  discussions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: narzedzia/requirements-docx.txt
      - run: python -m pip install -r narzedzia/requirements-docx.txt
      - run: python -m unittest discover -s tests -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Oczekiwanie na zamknięcie dyskusji decyzji
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null) | select(any(.labels[]; .name == "decyzja")) | .number][0] // empty')
          if [[ -z "$pr_number" ]]; then
            exit 0
          fi
          path=$(gh pr view "$pr_number" --json files --jq '.files[].path | select(startswith("_decyzje/DR-") and endswith(".md"))' | head -n 1)
          test -n "$path"
          discussion_number=$(python narzedzia/resolve_discussion.py "$path")
          for attempt in {1..30}; do
            discussion_closed=$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){discussion(number:$number){closed}}}' -f owner=Fencer4Life -f name=Regulamin_Kadry-SPWS -F number="$discussion_number" --jq '.data.repository.discussion.closed')
            if [[ "$discussion_closed" == "true" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Dyskusja #${discussion_number} nie została zamknięta przed publikacją."
          exit 1
      - name: Pobranie otwartych i zamkniętych dyskusji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql --paginate --slurp -f query='query($endCursor:String){repository(owner:"Fencer4Life",name:"Regulamin_Kadry-SPWS"){discussions(first:100,after:$endCursor,states:[OPEN,CLOSED],orderBy:{field:UPDATED_AT,direction:DESC}){nodes{number title url body createdAt closedAt author{login} category{slug} comments{totalCount} labels(first:20){nodes{name}}}pageInfo{hasNextPage endCursor}}}}' > /tmp/discussions.json
          python narzedzia/sync_discussions.py /tmp/discussions.json _data/discussions.json
      - uses: actions/configure-pages@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v5
