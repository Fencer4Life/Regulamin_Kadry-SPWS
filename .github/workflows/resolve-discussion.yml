name: Zamknięcie dyskusji po decyzji
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numer scalonego PR z kartą decyzji do ponownego przetworzenia
        required: true
        type: number

permissions:
  actions: write
  contents: read
  pull-requests: read
  discussions: write

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'decyzja'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Powiązanie opublikowanej decyzji i techniczne zamknięcie dyskusji
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" --json mergedAt,labels --jq '(.mergedAt != null) and any(.labels[]; .name == "decyzja")' | grep -qx true
          path=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path | select(startswith("_decyzje/DR-") and endswith(".md"))' | head -n 1)
          test -n "$path"
          discussion_number=$(python narzedzia/resolve_discussion.py "$path")
          discussion=$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){discussion(number:$number){id closed}}}' -f owner=Fencer4Life -f name=Regulamin_Kadry-SPWS -F number="$discussion_number")
          discussion_id=$(jq -r '.data.repository.discussion.id' <<< "$discussion")
          discussion_closed=$(jq -r '.data.repository.discussion.closed' <<< "$discussion")
          test -n "$discussion_id"
          slug=$(basename "$path" .md | tr '[:upper:]' '[:lower:]')
          card_url="https://fencer4life.github.io/Regulamin_Kadry-SPWS/decyzje/${slug}/"
          if [[ "$discussion_closed" != "true" ]]; then
            gh api graphql -f query='mutation($discussionId:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussionId,body:$body}){comment{id}}}' -F discussionId="$discussion_id" -f body="Opublikowano kartę decyzji: ${card_url}"
            gh api graphql -f query='mutation($discussionId:ID!){closeDiscussion(input:{discussionId:$discussionId,reason:RESOLVED}){discussion{id}}}' -F discussionId="$discussion_id"
          fi
          gh workflow run pages.yml --ref main
