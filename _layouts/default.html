<!doctype html>
<html lang="{{ site.lang | default: 'pl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/rejestr.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Regulamin Kadry SPWS</a>
      <nav aria-label="Nawigacja główna">
        <a href="{{ '/' | relative_url }}">Rejestr decyzji</a>
        <a href="https://github.com/Fencer4Life/Regulamin_Kadry-SPWS#readme">O projekcie</a>
        <a href="{{ '/regulamin/Regulamin-powolywania-reprezentacji-Polski-weteranów-w-szermierce_2026.docx' | relative_url }}">Pobierz DOCX</a>
      </nav>
    </div>
  </header>
  <main class="shell" id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="shell">Projekt regulaminu na sezon 2026/2027 · dokument niezatwierdzony przez PZSz</div>
  </footer>
  <script src="{{ '/assets/rejestr.js' | relative_url }}" defer></script>
</body>
</html>
